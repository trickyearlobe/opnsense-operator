# Default values for opnsense-operator.

image:
  repository: ghcr.io/trickyearlobe/opnsense-operator
  # tag defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# OPNsense API connection.
opnsense:
  # Firewall root URL (no trailing /api).
  url: "https://opnsense.lan"
  # Skip TLS verification — only for self-signed firewall certs.
  insecure: false
  # Credentials. Prefer an existing Secret (e.g. created by an ExternalSecret or
  # SealedSecret) holding keys `api-key` and `api-secret`:
  existingSecret: ""
  # ...or supply inline (templated into a Secret). DO NOT commit real values to
  # Git — use --set / a values override / a secrets manager.
  apiKey: ""
  apiSecret: ""

# Controller behaviour (maps to env vars).
config:
  dnsDomain: lan
  reconfigureDebounce: 2s
  resyncPeriod: 10m
  dns:
    # Default DNS backend when a Service doesn't set the dns-backend annotation:
    # "ddclient" (external provider via os-ddclient), "unbound", or "dnsmasq".
    backend: ddclient
    # Description of the os-ddclient account whose hostnames the operator manages
    # (required for the ddclient backend; the account's creds/zone live on the box).
    ddclientAccount: ""
  # Listen address for operator-created "dedicated" frontends.
  frontendBindAddress: "0.0.0.0"
  # Firewall (WAN exposure) settings. See docs/edge-provisioner.md.
  firewall:
    # Which firewall-rule API to drive: "automation" (validated os-firewall
    # Automation/Filter API) or "rules-new" (new core API, not yet wired).
    ruleApi: automation
    # OPNsense interface key for WAN pass rules. Operator policy, not annotation.
    wanInterface: wan
    # Inclusive port range an expose-wan annotation may open (e.g. "9000-9099").
    # Empty (default) denies every WAN port, so exposure must be opted into here.
    wanAllowedPorts: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

leaderElection:
  enabled: true

# Metrics + health probes.
metrics:
  enabled: true
  port: 8080
probePort: 8081

# ServiceMonitor for the Prometheus operator (e.g. kube-prometheus-stack).
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables, verbatim.
extraEnv: []
